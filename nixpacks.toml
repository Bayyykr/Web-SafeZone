[phases.setup]
nixPkgs = ["php84", "php84Packages.composer", "nodejs_20"]

[phases.install]
cmds = [
    "composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader",
    "npm ci || npm install"
]

[phases.build]
cmds = [
    "npm run build"
]

[variables]
NIXPACKS_PHP_ROOT_DIR = "/public"
APP_ENV = "production"
